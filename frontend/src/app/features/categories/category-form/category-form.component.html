<div class="form-card">
  <h3>{{ editingCategory()?.id ? 'Edit' : 'Create' }} Category</h3>
  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="name">Name *</label>
      <input type="text" id="name" formControlName="name" placeholder="Category name" />
      @if(categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched) {
       <div class="error">Name is required.</div>
      }
    </div>

    <div class="form-group">
      <label for="parentId">Parent Category</label>
      <select id="parentId" formControlName="parentId">
        <option value="">-- No Parent --</option>
        @for(cat of categories(); track cat.id) {
          <!-- Prevent selecting itself as parent -->
           @if(cat.id !== editingCategory()?.id) {
             <option [value]="cat.id">{{ cat.name }}</option>
           }
        }
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="categoryForm.invalid">Save</button>
      <button type="button" class="btn-secondary" (click)="cancel.emit()">Cancel</button>
    </div>
    
  </form>
</div>
