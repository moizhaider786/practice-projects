<div class="page-header">
  <h2>Products</h2>
  <button *ngIf="!showForm" class="btn-primary" (click)="onAddNew()">Add New Product</button>
</div>

@if(showForm){
  <app-product-form
    [categories]="categories()"
    [editingProduct]="editingProduct"
    (save)="onSave($event)"
    (cancel)="onCancel()">
  </app-product-form>
}
@if(!showForm){
  <app-product-list
    [products]="products()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-product-list>
}
