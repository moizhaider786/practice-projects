<div class="page-header">
  <h2>Products</h2>
  <button *ngIf="!showForm" class="btn-primary" (click)="onAddNew()">Add New Product</button>
</div>

<app-product-form
  *ngIf="showForm"
  [categories]="categories"
  [editingProduct]="editingProduct"
  (save)="onSave($event)"
  (cancel)="onCancel()">
</app-product-form>

<app-product-list
  *ngIf="!showForm"
  [products]="products"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)">
</app-product-list>
