<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOPD — Mini Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <span class="logo">SHOPD</span>
      <button class="cart-toggle" id="cartToggle">
        <span class="cart-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
        </span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="layout">

    <!-- PRODUCT GRID -->
    <section class="shop-section">
      <div class="section-label">— NEW ARRIVALS</div>
      <h2 class="section-title">This Season's Picks</h2>

      <div class="product-grid" id="productGrid">

        <!-- Product cards injected by TS -->
        <!-- TEMPLATE (hidden, for reference):
        <article class="product-card" data-id="1">
          <div class="product-image">
            <div class="image-placeholder"></div>
            <span class="product-category">CATEGORY</span>
          </div>
          <div class="product-info">
            <h3 class="product-name">Product Name</h3>
            <div class="product-meta">
              <span class="product-price">$00.00</span>
              <span class="product-rating">★★★★☆</span>
            </div>
            <button class="btn-add" data-id="1">Add to Cart</button>
          </div>
        </article>
        -->

      </div>
    </section>

    <!-- CART SIDEBAR -->
    <aside class="cart-sidebar" id="cartSidebar">
      <div class="cart-header">
        <h2 class="cart-title">Your Cart</h2>
        <button class="cart-close" id="cartClose">✕</button>
      </div>

      <div class="cart-items" id="cartItems">
        <!-- Cart items injected by TS -->
        <!-- EMPTY STATE (shown when cart is empty): -->
        <div class="cart-empty" id="cartEmpty">
          <p>Your cart is empty.</p>
          <span>Add something nice ↑</span>
        </div>
      </div>

      <div class="cart-footer" id="cartFooter">
        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span id="shipping">$0.00</span>
          </div>
          <div class="summary-row total-row">
            <span>Total</span>
            <span id="total">$0.00</span>
          </div>
        </div>
        <button class="btn-checkout" id="checkoutBtn">Checkout</button>
        <button class="btn-clear" id="clearCartBtn">Clear Cart</button>
      </div>

    </aside>

    <!-- CART OVERLAY -->
    <div class="cart-overlay" id="cartOverlay"></div>

  </main>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast">
    <span id="toastMessage">Item added to cart</span>
  </div>

  <!-- TS compiled output goes here -->
  <script src="app.js"></script>
</body>
</html>
